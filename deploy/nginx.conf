# Replace workbench.example.invalid and place valid TLS certs at deploy/tls/fullchain.pem + privkey.pem.
# The app is not published to the host; the only public path is this TLS + auth gateway.
# Apply conservative per-IP backpressure at the TLS edge; tune after workload tests.
limit_req_zone $binary_remote_addr zone=workbench_api:10m rate=10r/s;

upstream workbench_app {
    server app:8088;
    keepalive 16;
}
upstream workbench_auth {
    server auth-proxy:4180;
    keepalive 8;
}

server {
    listen 80;
    server_name workbench.example.invalid;
    client_max_body_size 21m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name workbench.example.invalid;
    client_max_body_size 21m;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /oauth2/auth {
        internal;
        proxy_pass http://workbench_auth/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /oauth2/ {
        proxy_pass http://workbench_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /metrics {
        deny all;
        return 403;
    }

    location / {
        limit_req zone=workbench_api burst=50 nodelay;
        limit_req_status 429;
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

        proxy_pass http://workbench_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Always overwrite identity headers from client input with values returned by the IdP gateway.
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-Groups $auth_groups;
        proxy_set_header Authorization "";
    }
}
