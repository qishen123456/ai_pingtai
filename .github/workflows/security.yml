name: Dependency security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit pinned runtime dependencies
        run: pip-audit -r requirements.txt
